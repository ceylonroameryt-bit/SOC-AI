services:
  # ── 1. Backend Server (Express Node.js) ────────────────────────────────────────
  - type: web
    name: no-entry-soc-backend
    runtime: node
    plan: free
    buildCommand: cd soc-platform-ui-main && npm install && npm run build
    startCommand: cd soc-platform-ui-main && node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with Supabase / Neon connection string
      - key: INGEST_API_KEY
        generateValue: true
      - key: NOTIFICATION_API_KEY
        generateValue: true
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: TEAMS_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false # Set to your Vercel frontend URL: https://soc-ai-six.vercel.app

  # ── 2. AI Microservice (Python FastAPI) ───────────────────────────────────────
  # P2 item 29: OPENAI_API_KEY removed — app.py does NOT use it.
  # AI_SERVICE_URL aligned to port 8000 (default uvicorn port).
  - type: web
    name: no-entry-ai-microservice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: INGEST_API_KEY
        sync: false # Must match the backend service's INGEST_API_KEY
      - key: ALLOWED_ORIGIN
        sync: false # Set to your Vercel frontend URL
      # AI_SERVICE_URL on the backend should be set to this service's Render URL
      # e.g., https://no-entry-ai-microservice.onrender.com
