name: Build and deploy Node.js app to Azure Web App - my-soc-platform-v2

on:
  push:
    branches:
      - main
    paths:
      - 'soc-platform-ui-main/**'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: soc-platform-ui-main/package-lock.json

      - name: Build frontend & server dependencies
        working-directory: soc-platform-ui-main
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: soc-platform-ui-main

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./app-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7C41BA0A573546D2A525CE007052886E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6506C6A3238943958ECB712156DCCFEB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A19A0122F76F4EE2BB0D250AABE59D8E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'my-soc-platform-v2'
          slot-name: 'Production'
          package: ./app-deploy
