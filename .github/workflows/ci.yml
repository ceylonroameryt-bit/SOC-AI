name: CI / Build & Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-and-server:
    name: Build & Lint Frontend & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: soc-platform-ui-main/package-lock.json

      - name: Install Dependencies
        working-directory: soc-platform-ui-main
        run: npm ci

      - name: Run Linter
        working-directory: soc-platform-ui-main
        run: npm run lint

      - name: Run Build
        working-directory: soc-platform-ui-main
        run: npm run build

  python-microservice:
    name: Validate Python AI Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Microservice Syntax
        run: |
          python -m py_compile app.py
