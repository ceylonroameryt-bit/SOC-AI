name: CI / Build & Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-and-server:
    name: Build & Lint Frontend & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: soc-platform-ui-main/package-lock.json

      - name: Install Dependencies
        working-directory: soc-platform-ui-main
        run: npm ci

      - name: Run Linter
        working-directory: soc-platform-ui-main
        run: npm run lint

      # P2 item 25: npm audit at high level blocks CI on new high/critical vulns
      - name: Security Audit
        working-directory: soc-platform-ui-main
        run: npm audit --audit-level=high

      - name: Run Test Suite & Build
        working-directory: soc-platform-ui-main
        run: npm test

  python-microservice:
    name: Validate Python AI Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # P2 item 25: real Python linting step (not just syntax check)
      - name: Lint with flake8
        run: |
          pip install flake8
          # E501 = line-too-long, W503 = line break before binary op (style-only)
          flake8 app.py --max-line-length=120 --ignore=E501,W503 --count

      - name: Verify Microservice Syntax
        run: |
          python -m py_compile app.py
          echo "Python syntax check passed."

      # P2 item 25: basic import/startup test for FastAPI app
      - name: Test FastAPI App Startup
        run: |
          python -c "
          import os
          os.environ['INGEST_API_KEY'] = 'test-ci-key'
          os.environ['ALLOWED_ORIGIN'] = 'http://localhost:3000'
          from app import app
          assert app is not None, 'FastAPI app failed to initialize'
          print('FastAPI app initialization: OK')
          "
