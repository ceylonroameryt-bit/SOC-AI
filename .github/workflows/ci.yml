name: CI / Build & Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-and-server:
    name: Build & Lint Frontend & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: soc-platform-ui-main/package-lock.json

      - name: Install Dependencies
        working-directory: soc-platform-ui-main
        run: npm ci || npm install

      - name: Run Linter
        working-directory: soc-platform-ui-main
        run: npm run lint

      # P2 item 25: npm audit at high level reports high/critical vulns
      - name: Security Audit
        working-directory: soc-platform-ui-main
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run Test Suite & Build
        working-directory: soc-platform-ui-main
        run: npm test

